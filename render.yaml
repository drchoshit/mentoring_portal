services:
  - type: web
    name: mentoring-api
    runtime: node
    rootDir: .
    buildCommand: npm install --workspace apps/server
    startCommand: npm run start --workspace apps/server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 18.20.2
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        fromService:
          name: mentoring-web
          type: web
          property: host
      - key: DB_PATH
        value: /var/data/db.sqlite
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: STUDENT_SYNC_API_KEY
        sync: false
      - key: MEDI_WEEKLY_BASE_URL
        sync: false
      - key: MEDI_WEEKLY_USERNAME
        sync: false
      - key: MEDI_WEEKLY_PASSWORD
        sync: false
      - key: MEDI_WEEKLY_JWT_SECRET
        sync: false
      - key: MEDI_SCHEDULE_BASE_URL
        sync: false
      - key: MEDI_SCHEDULE_USERNAME
        sync: false
      - key: MEDI_SCHEDULE_PASSWORD
        sync: false
      - key: MEDI_SCHEDULE_ALLOW_CREATE
        value: false
      - key: MEDI_SCHEDULE_SYNC_PROFILES
        value: false
      - key: LIVE_SYNC_INTERVAL_MS
        value: 60000
      - key: LIVE_SYNC_TIMEOUT_MS
        value: 20000
    disk:
      name: mentoring-data
      mountPath: /var/data
      sizeGB: 2
  - type: web
    name: mentoring-web
    env: static
    rootDir: .
    buildCommand: npm install --workspace apps/web && VITE_API_BASE=https://${API_HOST:-localhost} npm run build --workspace apps/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: 18.20.2
      - key: API_HOST
        fromService:
          name: mentoring-api
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
